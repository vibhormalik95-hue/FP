[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmp9500-feed-control"
version = "0.1.0"
description = "Reproducible offline short-video recommendation control benchmark"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
# The trained SASRec recommender and the original experiments need PyTorch.
# The demonstration scenarios and the review workflow do not.
recommender = ["torch>=2.5.1,<3"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
claude-personal = []
# Feed Control Studio model providers (bring your own key).
studio = ["anthropic>=0.89", "openai>=2"]

[tool.setuptools.packages.find]
include = ["feedctrl*", "studio*"]

[tool.setuptools.package-data]
studio = ["static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"


[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cmp9500-feed-control"
version = "0.1.0"
description = "Reproducible offline short-video recommendation control benchmark"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "scipy>=1.11,<2", "torch>=2.5.1,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
analysis = ["matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
include = ["feedctrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

